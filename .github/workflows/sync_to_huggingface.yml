name: Sync to Hugging Face Spaces 
 
on: 
  push: 
    branches: [main] 
  workflow_dispatch: 
 
jobs: 
  sync-to-hub: 
    runs-on: ubuntu-latest 
    steps: 
      - name: Checkout code 
        uses: actions/checkout@v4 
 
      - name: Push to Hub 
        env: 
          HF_TOKEN: ${{ secrets.HF_TOKEN }} 
        run: | 
          rm -rf checkpoints/ checkpoints_backup/ .git/ 
          git init 
          git config --global user.email "deploy@github.com" 
          git config --global user.name "GitHub Actions" 
          git checkout -b main 
          git add . 
          git commit -m "Clean serverless code deployment" 
          git push --force https://Tanyeah:$HF_TOKEN@huggingface.co/spaces/Tanyeah/early-alzheimers-diagnostic-prioritization main 
